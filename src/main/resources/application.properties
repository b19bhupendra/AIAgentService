spring.application.name=AIAgentService

# Application port
server.port=8084

# Gemini API configuration
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.model=gemini-3.1-flash-lite

# Model response configuration: 0.0 ? more consistent and predictable responses., 0.3 ? relatively consistent, with some variation.
spring.ai.google.genai.chat.temperature=0.3